@"
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NPM_CONFIG_PRODUCTION = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
"@ | Out-File -FilePath netlify.toml -Encoding UTF8

git add netlify.toml
git commit -m "Configurar Netlify para instalar devDependencies"
git push